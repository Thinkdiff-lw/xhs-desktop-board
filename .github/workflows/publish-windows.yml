name: Publish verified Windows artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and verify run ID
        required: true
      tag:
        description: Existing release tag
        required: true
        default: v1.0.0
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate source and publish the checked package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(gh run view "$SOURCE_RUN" --json conclusion --jq .conclusion)" == success ]]
          SOURCE_SHA=$(gh run view "$SOURCE_RUN" --json headSha --jq .headSha)
          RELEASE_TARGET=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .target_commitish)
          [[ "$SOURCE_SHA" == "$RELEASE_TARGET" ]]
          gh run download "$SOURCE_RUN" --name windows-x64 --dir incoming
          (cd incoming; sha256sum --check "XhsBoard-Windows-x64-$RELEASE_TAG.zip.sha256")
          gh release upload "$RELEASE_TAG" "incoming/XhsBoard-Windows-x64-$RELEASE_TAG.zip"
          gh release edit "$RELEASE_TAG" --draft=false --latest
