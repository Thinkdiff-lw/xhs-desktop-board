name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build native Windows release
        shell: pwsh
        run: |
          ./build-native.ps1 -Python (Get-Command python).Source
          $binaryFolder = Get-ChildItem dist -Directory -Filter 'native-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python tools/package_windows.py --binaries $binaryFolder.FullName --output release/XhsBoard-Windows-x64-v1.0.0.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: release/*.zip*
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build universal app and run native core checks
        id: build
        run: bash macos/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.runner }}-universal
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.package }}.sha256
          if-no-files-found: error
